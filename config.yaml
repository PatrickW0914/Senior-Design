# Single source of truth for settings. Change values here, not in code.
# Relative paths are resolved against the repo root.

source: 0                  # camera index or video path; `--source` on the command line overrides

camera:
  backend: auto            # auto | dshow | msmf (Windows) | avfoundation (macOS) | v4l2 (Linux)
                           # on Windows auto = msmf; dshow ignores fourcc and gives ~10 fps at 720p
  fourcc: MJPG             # compressed USB format. msmf rejects this and reaches 30 fps without it.
                           # Empty = camera default
  width: 1280
  height: 720
  fps: 30
  hfov_deg: 78.0           # horizontal field of view; measure it for your camera (Task 6)
  latency_s: 0.0           # capture latency from a clap test; fed to SessionClock

detect:                    # Task 4. Model files: python tools/get_models.py
  backend: scrfd           # scrfd: ~15 ms/frame, finds the faces | mediapipe: ~2 ms, misses about half at room scale
  width: 960               # detect on the frame downscaled to this width; boxes are mapped back to full size
  min_confidence: 0.5
  scrfd:
    pack: buffalo_sc       # buffalo_sc = det_500m (~15 ms) | buffalo_l = det_10g (~95 ms, same recall on our clips)
    det_size: 640          # network input size; 480 halves the time and loses ~3% of faces
    root: models/insightface
  mediapipe:
    model_path: models/blaze_face_short_range.tflite

track:                     # Task 5: ByteTrack via supervision. Task 12: re-ID
  max_lost_s: 2.0          # a track keeps its ID this long without a detection (occlusion, missed frames)
  lost_velocity_decay: 0.8 # per frame while lost; 1.0 = keep extrapolating the last velocity, 0 = stay put
  reacquire_radius_h: 1.5  # a new track this many face heights from where an ID vanished (< max_lost_s ago) takes it over; 0 = off
  activation_threshold: 0.5  # detector score needed to start a track
  match_threshold: 0.8     # ByteTrack matching threshold on 1 - IoU; lower is stricter
  min_consecutive_frames: 1  # detections needed before a new track is reported (1 = second frame)
  reid:
    enabled: false
    model: buffalo_l       # insightface model pack
    similarity_threshold: 0.45

speaking:                  # Task 8: lip-motion score -> FaceObs.asd_prob
  model_path: models/face_landmarker.task
  window_s: 0.5            # lip-motion history used per score
  on_threshold: 0.6
  off_threshold: 0.4

fusion:                    # passed to av_event_log.SpeakingFusion once audio is added
  w_asd: 0.5
  w_doa: 0.4
  w_vad: 0.1
  on_threshold: 0.6
  off_threshold: 0.4
  tau_s: 0.25

output:
  dir: output
  prefix: session          # writes <dir>/<prefix>_faces.jsonl
